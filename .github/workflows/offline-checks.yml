name: Offline workflow and UI checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install workflow-test dependency
        run: python -m pip install PyYAML
      - name: Check workflow budgets and UI contracts
        run: python -m unittest discover -s tests -p 'test_conference_workflow_and_ui.py' -v
      - name: Check JavaScript utilities
        run: node --test tests/test_*.js
